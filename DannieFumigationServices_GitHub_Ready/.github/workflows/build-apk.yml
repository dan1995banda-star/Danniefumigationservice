name: Fix Project Structure

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Move Android project to root
        run: |
          if [ -d "DannieFumigationServices_GitHub_Ready" ]; then
            cp -a DannieFumigationServices_GitHub_Ready/. .
            rm -rf DannieFumigationServices_GitHub_Ready
          fi
          rm -f DannieFumigationServices_GitHub_Ready.zip

      - name: Commit changes
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add -A
          git commit -m "Fix Android project structure" || echo "Nothing to commit"
          git push
