      - name: Inspect Android project
        run: |
          echo "=== Project files ==="
          find . -maxdepth 4 -type f | sort

          echo "=== Gradle wrapper ==="
          find . -type f -name "gradlew" -print

          echo "=== Gradle settings ==="
          find . -type f \( -name "settings.gradle" -o -name "settings.gradle.kts" \) -print

          echo "=== Build files ==="
          find . -type f \( -name "build.gradle" -o -name "build.gradle.kts" \-print
