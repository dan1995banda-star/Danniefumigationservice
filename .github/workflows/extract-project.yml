name: Inspect Android Project

on:
  workflow_dispatch:

jobs:
  inspect:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Find Android project files
        run: |
          echo "===== ROOT ====="
          ls -la

          echo ""
          echo "===== ALL IMPORTANT FILES ====="

          find . -type f \( \
            -name "gradlew" -o \
            -name "gradlew.bat" -o \
            -name "settings.gradle" -o \
            -name "settings.gradle.kts" -o \
            -name "build.gradle" -o \
            -name "build.gradle.kts" -o \
            -name "AndroidManifest.xml" \
          \) -print

          echo ""
          echo "===== DIRECTORIES ====="

          find . -maxdepth 3 -type d | sort