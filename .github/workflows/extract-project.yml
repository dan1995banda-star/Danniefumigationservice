name: Create Gradle Wrapper

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  wrapper:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Find Android project
        id: find-project
        shell: bash
        run: |
          echo "Repository contents:"
          find . -maxdepth 3 -type f | sort | head -200

          if [ -f "settings.gradle" ] || [ -f "settings.gradle.kts" ]; then
            echo "project_dir=." >> "$GITHUB_OUTPUT"
          elif [ -f "DannieFumigationServices_GitHub_Ready/settings.gradle" ] || [ -f "DannieFumigationServices_GitHub_Ready/settings.gradle.kts" ]; then
            echo "project_dir=DannieFumigationServices_GitHub_Ready" >> "$GITHUB_OUTPUT"
          else
            PROJECT_DIR=$(find . -name "settings.gradle" -o -name "settings.gradle.kts" | head -1 | xargs dirname)

            if [ -z "$PROJECT_DIR" ]; then
              echo "ERROR: Could not find an Android/Gradle project."
              exit 1
            fi

            echo "project_dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"
          fi

      - name: Create Gradle Wrapper
        working-directory: ${{ steps.find-project.outputs.project_dir }}
        shell: bash
        run: |
          echo "Creating Gradle Wrapper..."
          gradle wrapper --gradle-version 8.11.1
          chmod +x gradlew

      - name: Verify Gradle Wrapper
        working-directory: ${{ steps.find-project.outputs.project_dir }}
        shell: bash
        run: |
          echo "=== Gradle Wrapper ==="
          ls -la gradlew
          ls -la gradlew.bat

          echo "=== Wrapper directory ==="
          ls -la gradle/wrapper

          echo "=== Gradle version ==="
          ./gradlew --version

      - name: Commit Gradle Wrapper
        shell: bash
        run: |
          git config user.name "github-actions"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A

          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Add Gradle Wrapper"
            git push
          fi
