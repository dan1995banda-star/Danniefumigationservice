name: Fix Project Structure

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Move Android project to root
        run: |
          if [ -d "DannieFumigationServices_GitHub_Ready" ]; then
            cp -a DannieFumigationServices_GitHub_Ready/. .
            rm -rf DannieFumigationServices_GitHub_Ready
          fi

      - name: Generate Gradle Wrapper
        run: |
          echo "=== Checking Android project ==="
          ls -la

          if [ ! -f "settings.gradle.kts" ]; then
            echo "ERROR: settings.gradle.kts not found"
            exit 1
          fi

          if [ ! -f "build.gradle.kts" ]; then
            echo "ERROR: build.gradle.kts not found"
            exit 1
          fi

          echo "=== Generating Gradle Wrapper ==="
          gradle wrapper --gradle-version 8.11.1

      - name: Verify Gradle Wrapper
        run: |
          echo "=== Gradle wrapper files ==="
          find . -maxdepth 3 -type f \( -name "gradlew" -o -name "gradlew.bat" -o -name "gradle-wrapper.jar" -o -name "gradle-wrapper.properties" \) -print

          if [ ! -f "gradlew" ]; then
            echo "ERROR: gradlew was not created"
            exit 1
          fi

          chmod +x gradlew
          echo "SUCCESS: gradlew exists"

      - name: Commit changes
        run: |
          git config user.name "github-actions"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A

          git commit -m "Fix Android project structure and add Gradle wrapper" || echo "Nothing to commit"

          git push origin HEAD:main