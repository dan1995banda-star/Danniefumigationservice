name: Fix Project Structure

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Move project to root
        run: |
          if [ -d "DannieFumigationServices_GitHub_Ready" ]; then
            cp -r DannieFumigationServices_GitHub_Ready/. .
            rm -rf DannieFumigationServices_GitHub_Ready
          fi

      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Create Gradle Wrapper
        run: |
          gradle wrapper --gradle-version 8.11.1
          chmod +x gradlew

      - name: Verify
        run: |
          echo "=== PROJECT ==="
          ls -la
          echo "=== WRAPPER ==="
          ls -la gradlew
          ls -la gradle/wrapper/

      - name: Commit
        run: |
          git config user.name "github-actions"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Create Android Gradle wrapper" || true
          git push