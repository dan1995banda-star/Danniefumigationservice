name: Extract Android Project

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract project ZIP
        run: |
          unzip -o DannieFumigationServices_GitHub_Ready.zip -d extracted
          cp -r extracted/. .
          rm -rf extracted
          rm -f DannieFumigationServices_GitHub_Ready.zip

      - name: Commit project files
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add -A
          git commit -m "Extract Android project" || echo "Nothing to commit"
          git push
