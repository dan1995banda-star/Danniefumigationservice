name: Create Gradle Wrapper

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  wrapper:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Create wrapper
        working-directory: DannieFumigationServices_GitHub_Ready
        run: |
          gradle wrapper --gradle-version 8.11.1
          chmod +x gradlew

      - name: Check wrapper
        working-directory: DannieFumigationServices_GitHub_Ready
        run: |
          echo "=== gradlew ==="
          ls -l gradlew
          echo "=== gradlew.bat ==="
          ls -l gradlew.bat
          echo "=== wrapper directory ==="
          ls -l gradle/wrapper

      - name: Commit wrapper
        run: |
          git config user.name "github-actions"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add DannieFumigationServices_GitHub_Ready/gradlew
          git add DannieFumigationServices_GitHub_Ready/gradlew.bat
          git add DannieFumigationServices_GitHub_Ready/gradle/wrapper

          git diff --cached --quiet || git commit -m "Add Gradle wrapper"
          git push        run: |
          git config user.name "github-actions"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add DannieFumigationServices_GitHub_Ready/gradlew
          git add DannieFumigationServices_GitHub_Ready/gradlew.bat
          git add DannieFumigationServices_GitHub_Ready/gradle/wrapper
