name: Fix Project Structure

on:
  workflow_dispatch:

jobs:
  fix:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Show repository
        run: |
          echo "Repository contents:"
          find . -maxdepth 2 -type f | sort

      - name: Prepare Android project
        run: |
          if [ -d "DannieFumigationServices_GitHub_Ready" ]; then
            echo "Android project found."

            cp -a DannieFumigationServices_GitHub_Ready/. .

            echo "Android project copied to root."
          else
            echo "DannieFumigationServices_GitHub_Ready folder was not found."
          fi

      - name: Check Android files
        run: |
          echo "Checking for Gradle files..."

          if [ -f "settings.gradle" ] || [ -f "settings.gradle.kts" ]; then
            echo "Gradle settings file found."
          else
            echo "ERROR: No Gradle settings file found."
            exit 1
          fi

          if [ -f "gradlew" ]; then
            echo "Gradle wrapper found."
          else
            echo "ERROR: gradlew not found."
            exit 1
          fi

          echo "Project structure looks ready."