name: Build APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      - name: Find Android project
        id: project
        shell: bash
        run: |
          set -e

          PROJECT_DIR=""

          while IFS= read -r file; do
            DIR="$(dirname "$file")"

            if [ -f "$DIR/settings.gradle.kts" ] || [ -f "$DIR/settings.gradle" ]; then
              PROJECT_DIR="$DIR"
              break
            fi
          done < <(find . -type f \( -name "settings.gradle.kts" -o -name "settings.gradle" \) -print)

          if [ -z "$PROJECT_DIR" ]; then
            echo "ERROR: No Gradle project found."
            find . -maxdepth 5 -type f | sort
            exit 1
          fi

          PROJECT_DIR="${PROJECT_DIR#./}"

          echo "Android project found at: $PROJECT_DIR"
          echo "project_dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"

      - name: Generate Gradle wrapper
        working-directory: ${{ steps.project.outputs.project_dir }}
        run: gradle wrapper --gradle-version 8.11.1

      - name: Build Debug APK
        working-directory: ${{ steps.project.outputs.project_dir }}
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Dannie-Fumigation-Debug-APK
          path: '**/app/build/outputs/apk/debug/app-debug.apk'
