name: Build Android APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Find Android project
        id: project
        shell: bash
        run: |
          if [ -f "settings.gradle" ] || [ -f "settings.gradle.kts" ]; then
            echo "dir=." >> "$GITHUB_OUTPUT"
          else
            PROJECT_DIR=$(find . -name "settings.gradle" -o -name "settings.gradle.kts" | head -1 | xargs dirname 2>/dev/null || true)

            if [ -z "$PROJECT_DIR" ] || [ "$PROJECT_DIR" = "." ]; then
              echo "ERROR: Android Gradle project not found (no settings.gradle or settings.gradle.kts)."
              exit 1
            fi

            echo "dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"
          fi
          echo "Project directory: ${{ steps.project.outputs.dir }}"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3   # or @v4

      - name: Make Gradle executable
        working-directory: ${{ steps.project.outputs.dir }}
        run: chmod +x gradlew

      - name: Build Debug APK
        working-directory: ${{ steps.project.outputs.dir }}
        run: |
          ./gradlew assembleDebug --stacktrace --info
          # Optional: list the output so you can confirm the path
          find . -name "*.apk" -type f

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Dannie-Fumigation-Services-APK
          path: |
            ${{ steps.project.outputs.dir }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error   # fails the job if no APK is found
