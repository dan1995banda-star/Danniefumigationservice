- name: Setup Android SDK
  run: |
    # The runner already has a base SDK
    echo "sdk.dir=$ANDROID_HOME" >> $GITHUB_ENV
    # Accept licenses (already done by the action, but safe to repeat)
    yes | sdkmanager --licenses
    # Install only the packages you need, e.g.
    sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0"
