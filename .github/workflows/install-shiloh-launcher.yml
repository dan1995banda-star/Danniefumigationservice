name: Fix Shiloh Launcher and Build APK

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Find Android project
        id: project
        shell: bash
        run: |
          set -e

          if [ -f "settings.gradle" ] || [ -f "settings.gradle.kts" ]; then
            PROJECT="."
          else
            SETTINGS=$(find . \
              -type f \
              \( -name "settings.gradle" -o -name "settings.gradle.kts" \) \
              -not -path "./.git/*" \
              | head -1)

            if [ -z "$SETTINGS" ]; then
              echo "ERROR: Android project not found."
              exit 1
            fi

            PROJECT=$(dirname "$SETTINGS")
          fi

          echo "PROJECT=$PROJECT"
          echo "project_dir=$PROJECT" >> "$GITHUB_OUTPUT"

      # =========================================================
      # FORCE REMOVE THE OLD BROKEN ADAPTIVE ICON
      # =========================================================

      - name: Remove old broken launcher resources
        working-directory: ${{ steps.project.outputs.project_dir }}
        shell: bash
        run: |
          set -e

          echo "Searching for old launcher files..."

          find app/src/main/res \
            -type f \
            \( \
              -name "ic_launcher.xml" \
              -o -name "ic_launcher_round.xml" \
              -o -name "ic_launcher_foreground.xml" \
              -o -name "ic_launcher_foreground.png" \
            \) \
            -print || true

          echo
          echo "Removing old adaptive launcher directory..."

          rm -rf app/src/main/res/mipmap-anydpi-v26

          echo "Removing any old foreground resources..."

          find app/src/main/res \
            -type f \
            \( \
              -name "ic_launcher_foreground.xml" \
              -o -name "ic_launcher_foreground.png" \
            \) \
            -delete || true

          echo
          echo "Searching for ic_launcher_foreground references..."

          if grep -R \
            "ic_launcher_foreground" \
            app/src/main/res \
            --include="*.xml" \
            --include="*.kt" \
            --include="*.java"; then

            echo
            echo "ERROR: Old ic_launcher_foreground reference still exists."
            exit 1
          fi

          echo
          echo "Old launcher references successfully removed."

      # =========================================================
      # INSTALL SHILOH IMAGE
      # =========================================================

      - name: Install Shiloh launcher image
        working-directory: ${{ steps.project.outputs.project_dir }}
        shell: bash
        run: |
          set -e

          mkdir -p app/src/main/res/drawable
          mkdir -p app/src/main/res/mipmap

          if [ ! -f "launcher-source/shiloh_launcher.png" ]; then
            echo "ERROR: Launcher image not found."
            echo
            echo "Expected:"
            echo "launcher-source/shiloh_launcher.png"
            echo
            echo "Please upload the Shiloh launcher image to that location."
            exit 1
          fi

          cp \
            launcher-source/shiloh_launcher.png \
            app/src/main/res/drawable/shiloh_launcher.png

          cp \
            launcher-source/shiloh_launcher.png \
            app/src/main/res/mipmap/ic_launcher.png

          cp \
            launcher-source/shiloh_launcher.png \
            app/src/main/res/mipmap/ic_launcher_round.png

          echo
          echo "Launcher files installed:"
          ls -lh app/src/main/res/drawable/shiloh_launcher.png
          ls -lh app/src/main/res/mipmap/ic_launcher.png
          ls -lh app/src/main/res/mipmap/ic_launcher_round.png

      # =========================================================
      # UPDATE MANIFEST
      # =========================================================

      - name: Update AndroidManifest.xml
        working-directory: ${{ steps.project.outputs.project_dir }}
        shell: bash
        run: |
          set -e

          MANIFEST="app/src/main/AndroidManifest.xml"

          if [ ! -f "$MANIFEST" ]; then
            echo "ERROR: AndroidManifest.xml not found."
            exit 1
          fi

          echo "Before:"
          grep -nE 'android:(icon|roundIcon)' "$MANIFEST" || true

          sed -i \
            's/android:icon="@[^"]*"/android:icon="@mipmap\/ic_launcher"/g' \
            "$MANIFEST"

          sed -i \
            's/android:roundIcon="@[^"]*"/android:roundIcon="@mipmap\/ic_launcher_round"/g' \
            "$MANIFEST"

          echo
          echo "After:"
          grep -nE 'android:(icon|roundIcon)' "$MANIFEST" || true

      # =========================================================
      # VERIFY THERE IS NO OLD ADAPTIVE ICON
      # =========================================================

      - name: Verify launcher configuration
        working-directory: ${{ steps.project.outputs.project_dir }}
        shell: bash
        run: |
          set -e

          echo "Checking for old mipmap-anydpi-v26..."

          if [ -d "app/src/main/res/mipmap-anydpi-v26" ]; then
            echo "ERROR: mipmap-anydpi-v26 still exists."
            find app/src/main/res/mipmap-anydpi-v26 -type f -print
            exit 1
          fi

          echo "Good: old adaptive launcher directory does not exist."

          echo
          echo "Checking for old foreground references..."

          if grep -R \
            "ic_launcher_foreground" \
            app/src/main/res \
            --include="*.xml" \
            --include="*.kt" \
            --include="*.java"; then

            echo "ERROR: Old launcher reference found."
            exit 1
          fi

          echo "Good: no ic_launcher_foreground references."

          echo
          echo "Final launcher resources:"

          find app/src/main/res \
            -type f \
            \( \
              -name "*launcher*" \
              -o -name "shiloh_launcher.png" \
            \) \
            -print

      # =========================================================
      # CREATE GRADLE WRAPPER IF NEEDED
      # =========================================================

      - name: Create Gradle Wrapper if needed
        working-directory: ${{ steps.project.outputs.project_dir }}
        shell: bash
        run: |
          set -e

          if [ ! -f "gradlew" ]; then
            gradle wrapper --gradle-version 8.11.1
          fi

          chmod +x gradlew

      # =========================================================
      # CLEAN
      # =========================================================

      - name: Clean
        working-directory: ${{ steps.project.outputs.project_dir }}
        shell: bash
        run: |
          ./gradlew clean

      # =========================================================
      # BUILD
      # =========================================================

      - name: Build Debug APK
        working-directory: ${{ steps.project.outputs.project_dir }}
        shell: bash
        run: |
          ./gradlew assembleDebug --stacktrace

      # =========================================================
      # COMMIT EVERYTHING
      # =========================================================

      - name: Commit launcher changes
        shell: bash
        run: |
          set -e

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A

          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Fix Shiloh Mission app launcher"
            git push
          fi

      # =========================================================
      # UPLOAD APK
      # =========================================================

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Shiloh-SDB-Church-Debug-APK
          path: ${{ steps.project.outputs.project_dir }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
