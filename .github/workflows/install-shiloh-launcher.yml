      - name: PROVE OLD LAUNCHER IS REMOVED
        working-directory: ${{ steps.project.outputs.project_dir }}
        shell: bash
        run: |
          echo "========================================"
          echo "LAUNCHER CLEANUP VERIFICATION"
          echo "========================================"

          echo "Current directory:"
          pwd

          echo
          echo "Checking old launcher directory..."

          if [ -d "app/src/main/res/mipmap-anydpi-v26" ]; then
            echo "ERROR: OLD LAUNCHER DIRECTORY STILL EXISTS!"
            find app/src/main/res/mipmap-anydpi-v26 -type f -print
            exit 1
          fi

          echo "SUCCESS: mipmap-anydpi-v26 does NOT exist."

          echo
          echo "Searching entire app resource directory..."

          grep -R "ic_launcher_foreground" \
            app/src/main/res \
            --include="*.xml" \
            --include="*.kt" \
            --include="*.java" \
            || true

          echo
          echo "========================================"
          echo "LAUNCHER CLEANUP PASSED"
          echo "========================================"
