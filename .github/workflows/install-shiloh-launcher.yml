name: Install Shiloh Launcher and Build APK

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Find Android project
        id: project
        shell: bash
        run: |
          set -e

          if [ -f "settings.gradle" ] || [ -f "settings.gradle.kts" ]; then
            PROJECT="."
          else
            SETTINGS=$(find . \
              -type f \
              \( -name "settings.gradle" -o -name "settings.gradle.kts" \) \
              -not -path "./.git/*" \
              | head -1)

            if [ -z "$SETTINGS" ]; then
              echo "Android project not found."
              exit 1
            fi

            PROJECT=$(dirname "$SETTINGS")
          fi

          echo "Project: $PROJECT"
          echo "project_dir=$PROJECT" >> "$GITHUB_OUTPUT"

      # --------------------------------------------------
      # INSTALL THE SHILOH LAUNCHER IMAGE
      # --------------------------------------------------

      - name: Install launcher image
        working-directory: ${{ steps.project.outputs.project_dir }}
        shell: bash
        run: |
          set -e

          mkdir -p app/src/main/res/drawable

          if [ ! -f "launcher-source/shiloh_launcher.png" ]; then
            echo "ERROR:"
            echo "launcher-source/shiloh_launcher.png was not found."
            echo
            echo "Please add your launcher image here:"
            echo
            echo "launcher-source/shiloh_launcher.png"
            exit 1
          fi

          cp \
            launcher-source/shiloh_launcher.png \
            app/src/main/res/drawable/shiloh_launcher.png

          echo "Launcher installed:"
          ls -lh app/src/main/res/drawable/shiloh_launcher.png

      # --------------------------------------------------
      # CREATE SIMPLE LAUNCHER XML
      # --------------------------------------------------

      - name: Create launcher resources
        working-directory: ${{ steps.project.outputs.project_dir }}
        shell: bash
        run: |
          set -e

          mkdir -p app/src/main/res/mipmap

          cp \
            app/src/main/res/drawable/shiloh_launcher.png \
            app/src/main/res/mipmap/ic_launcher.png

          cp \
            app/src/main/res/drawable/shiloh_launcher.png \
            app/src/main/res/mipmap/ic_launcher_round.png

          echo "Launcher files:"
          ls -lh app/src/main/res/mipmap/

      # --------------------------------------------------
      # REMOVE OLD BROKEN ADAPTIVE ICON
      # --------------------------------------------------

      - name: Remove broken adaptive launcher
        working-directory: ${{ steps.project.outputs.project_dir }}
        shell: bash
        run: |
          rm -f app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml
          rm -f app/src/main/res/mipmap-anydpi-v26/ic_launcher_round.xml

          echo "Old adaptive launcher XML removed."

      # --------------------------------------------------
      # UPDATE MANIFEST
      # --------------------------------------------------

      - name: Update AndroidManifest.xml
        working-directory: ${{ steps.project.outputs.project_dir }}
        shell: bash
        run: |
          set -e

          MANIFEST="app/src/main/AndroidManifest.xml"

          if [ ! -f "$MANIFEST" ]; then
            echo "AndroidManifest.xml not found."
            exit 1
          fi

          sed -i \
            's/android:icon="@[^"]*"/android:icon="@mipmap\/ic_launcher"/g' \
            "$MANIFEST"

          sed -i \
            's/android:roundIcon="@[^"]*"/android:roundIcon="@mipmap\/ic_launcher_round"/g' \
            "$MANIFEST"

          echo "Launcher configuration:"
          grep -nE 'android:(icon|roundIcon)' "$MANIFEST" || true

      # --------------------------------------------------
      # CHECK NO OLD BROKEN REFERENCE EXISTS
      # --------------------------------------------------

      - name: Verify launcher configuration
        working-directory: ${{ steps.project.outputs.project_dir }}
        shell: bash
        run: |
          set -e

          echo "Searching for old ic_launcher_foreground references..."

          if grep -R \
            "ic_launcher_foreground" \
            app/src/main/res \
            --include="*.xml" \
            --include="*.kt" \
            --include="*.java"; then

            echo
            echo "ERROR: Old launcher reference still exists."
            exit 1

          fi

          echo "No broken foreground reference found."

          echo
          echo "Launcher files:"
          find app/src/main/res \
            \( -name "*launcher*" -o -name "shiloh_launcher.png" \) \
            -type f \
            -print

      # --------------------------------------------------
      # CREATE GRADLE WRAPPER IF NECESSARY
      # --------------------------------------------------

      - name: Create Gradle Wrapper
        working-directory: ${{ steps.project.outputs.project_dir }}
        shell: bash
        run: |
          set -e

          if [ ! -f "gradlew" ]; then
            gradle wrapper --gradle-version 8.11.1
          fi

          chmod +x gradlew

      # --------------------------------------------------
      # CLEAN
      # --------------------------------------------------

      - name: Clean project
        working-directory: ${{ steps.project.outputs.project_dir }}
        run: |
          ./gradlew clean

      # --------------------------------------------------
      # BUILD
      # --------------------------------------------------

      - name: Build Debug APK
        working-directory: ${{ steps.project.outputs.project_dir }}
        run: |
          ./gradlew assembleDebug --stacktrace

      # --------------------------------------------------
      # COMMIT LAUNCHER CHANGES
      # --------------------------------------------------

      - name: Commit launcher changes
        shell: bash
        run: |
          set -e

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A

          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Replace app launcher with Shiloh Mission icon"
            git push
          fi

      # --------------------------------------------------
      # UPLOAD APK
      # --------------------------------------------------

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Shiloh-SDB-Church-APK
          path: ${{ steps.project.outputs.project_dir }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
